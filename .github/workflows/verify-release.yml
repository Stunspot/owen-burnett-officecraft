name: Verify release
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python -B -m unittest discover -s codex/owen-burnett-officecraft/tests -p "test_*.py" -v
      - run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - run: python -B scripts/build_pages.py
      - run: git diff --exit-code -- docs
